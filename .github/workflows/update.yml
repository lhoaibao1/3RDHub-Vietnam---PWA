name: Publish preview update (owner testing)
# Mỗi lần đẩy code → bản thử trên kênh "preview" (chủ thử trước). Người dùng ở kênh "production": release-ios.yml.
on:
  push:
    branches: [main, claude/nifty-wozniak-y6il87]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      # Kênh "preview" luôn trỏ vào nhánh "preview": link cố định theo kênh luôn mở ra bản mới nhất (README.md).
      - run: eas channel:create preview --non-interactive || true
      - run: eas update --branch preview --platform ios --message "${{ github.sha }}" --non-interactive
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_AT: ${{ github.event.head_commit.timestamp }}
      - run: eas channel:edit preview --branch preview --non-interactive || true
