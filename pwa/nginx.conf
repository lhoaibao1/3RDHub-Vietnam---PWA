# Bản web PWA của 3RDHub Vietnam đặt sau nginx của HUB (app.3rdvn.io.vn), chung tên miền với API.
# Dán các khối dưới vào server {} đang phục vụ app.3rdvn.io.vn. Đổi PWA_ROOT thành thư mục đã giải nén dist-pwa.
#
# VÌ SAO PHẢI TÁCH RIÊNG file của PWA (lỗi 24/11/2026):
#   nginx đang chia theo thiết bị: điện thoại → PWA, máy tính → Nuxt. Nếu cả /_expo/*.js cũng chia theo thiết bị thì
#   máy tính / bot xin file đó sẽ nhận trang HTML của Nuxt, và Cloudflare (lưu đệm theo đường dẫn, không theo thiết
#   bị) giữ cái HTML đó 4 tiếng rồi trả cho mọi điện thoại → PWA trắng màn / màn mở được màn không.
#   Các đường dẫn dưới đây Nuxt không dùng (Nuxt ở /_nuxt/), nên luôn trả file của PWA, bất kể thiết bị.
#
# Sau khi đổi: Cloudflare → Caching → Purge Everything (hoặc purge /_expo/*) để xoá bản HTML đã lưu sai.

set $pwa_root /opt/3rdhub-pwa/dist-pwa;   # PWA_ROOT

# File JS/CSS/font của PWA: tên có mã băm nên lưu đệm lâu được. Không có file thì 404 (không rơi sang Nuxt).
location ^~ /_expo/ {
    root $pwa_root;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location ~ ^/assets/(assets|node_modules)/ {   # logo + font icon của PWA (mất font này là mất hết icon)
    root $pwa_root;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
# Manifest, service worker, icon của PWA: luôn lấy bản mới.
location ~ ^/(sw\.js|manifest\.webmanifest|icon-192\.png|icon-512\.png|apple-touch-icon\.png)$ {
    root $pwa_root;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Trang (index.html) của PWA: giữ cách chia điện thoại / máy tính đang có. Trong nhánh điện thoại:
#   root $pwa_root;
#   add_header Cache-Control "no-cache";
#   try_files $uri /index.html;
# Quan trọng: trả kèm "Cache-Control: no-cache" (hoặc private) cho trang HTML ở CẢ hai nhánh, kẻo Cloudflare lưu
# trang của nhánh này rồi trả cho nhánh kia.
